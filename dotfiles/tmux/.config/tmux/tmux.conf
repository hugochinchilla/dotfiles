# tmux reads ~/.tmux.conf FIRST and this file second, and omarchy seeds this path
# with its own status-bar theme — which is why tmux-power kept losing on every new
# server. So: omarchy's defaults (read from its source, not a stale copy), then
# ~/.tmux.conf again so my settings land last.
source-file -q ~/.local/share/omarchy/config/tmux/tmux.conf
source-file -q ~/.tmux.conf

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
