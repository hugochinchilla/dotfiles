# hy3 plugin: Sway-like tiling. Source this ONLY when hy3 builds against the
# current Hyprland. When it breaks, comment this out and keep tiling-custom.conf.
plugin = /var/cache/hyprpm/hchinchilla/hy3/hy3.so

general {
  layout = hy3
}

plugin {
  hy3 {
    enable = true
    group_inset = 2

    tabs {
      height = 30
      padding = 0
      radius = 0
      border_width = 1
      text_height = 11
      opacity = 0.7
    }
  }
}

# Focus movement
bind = SUPER, left,  hy3:movefocus, left
bind = SUPER, down,  hy3:movefocus, down
bind = SUPER, up,    hy3:movefocus, up
bind = SUPER, right, hy3:movefocus, right

# Move window within the layout
bind = SUPER SHIFT, left,  hy3:movewindow, l
bind = SUPER SHIFT, down,  hy3:movewindow, d
bind = SUPER SHIFT, up,    hy3:movewindow, u
bind = SUPER SHIFT, right, hy3:movewindow, r

bind = SUPER, A, hy3:changefocus, raise

# Splitting / Group Creation
#bind = SUPER, H, hy3:makegroup, h
#bind = SUPER, V, hy3:makegroup, v

unbind = SUPER, S
bind = SUPER, T, hy3:makegroup, tab
bind = SUPER, S, hy3:makegroup, h
bind = SUPER SHIFT, T, hy3:makegroup, tab, toggle

#bind = SUPER, SPACE, hy3:togglefocuslayer

# Close windows
bind = SUPER SHIFT, Q, hy3:killactive
