# Custom Hyprland keybinding overrides on top of omarchy's default tiling-v2.conf.
# Only keys that DIFFER from the defaults (or aren't defined upstream) live here.
# Identical re-bindings were removed: tiling-v2.conf already provides them, and
# defining the same key twice makes toggle dispatchers (fullscreen, togglesplit,
# togglegroup...) fire twice and cancel out.

decoration:blur:enabled = false

bind = SUPER, Z, movecurrentworkspacetomonitor, -1

# SUPER, X defaults to "Universal cut" in clipboard.conf — override to move workspace
unbind = SUPER, X  # was: Universal cut (clipboard.conf)
bind = SUPER, X, movecurrentworkspacetomonitor, +1

bind = SUPER, Q, workspace, previous

# Close window (base has no SUPER+SHIFT+Q). When hy3 is on, tiling-sway.conf
# unbinds this and rebinds it to hy3:killactive.
bindd = SUPER SHIFT, Q, Close window, killactive,

# SUPER, SPACE defaults to the app launcher in utilities.conf — override to float toggle
unbind = SUPER, SPACE  # was: Launch apps (utilities.conf)
bindd = SUPER, SPACE, Toggle window floating/tiling, togglefloating,

unbind = SUPER, d
bindd = SUPER, d, Application launcher, exec, omarchy-launch-walker

# Move active window to a workspace WITHOUT following it.
# tiling-v2.conf binds these to movetoworkspace (follows) — override to the silent variant.
unbind = SUPER SHIFT, code:10  # was: Move window to workspace 1 (tiling-v2.conf)
bindd = SUPER SHIFT, code:10, Move window to workspace 1, movetoworkspacesilent, 1
unbind = SUPER SHIFT, code:11  # was: Move window to workspace 2 (tiling-v2.conf)
bindd = SUPER SHIFT, code:11, Move window to workspace 2, movetoworkspacesilent, 2
unbind = SUPER SHIFT, code:12  # was: Move window to workspace 3 (tiling-v2.conf)
bindd = SUPER SHIFT, code:12, Move window to workspace 3, movetoworkspacesilent, 3
unbind = SUPER SHIFT, code:13  # was: Move window to workspace 4 (tiling-v2.conf)
bindd = SUPER SHIFT, code:13, Move window to workspace 4, movetoworkspacesilent, 4
unbind = SUPER SHIFT, code:14  # was: Move window to workspace 5 (tiling-v2.conf)
bindd = SUPER SHIFT, code:14, Move window to workspace 5, movetoworkspacesilent, 5
unbind = SUPER SHIFT, code:15  # was: Move window to workspace 6 (tiling-v2.conf)
bindd = SUPER SHIFT, code:15, Move window to workspace 6, movetoworkspacesilent, 6
unbind = SUPER SHIFT, code:16  # was: Move window to workspace 7 (tiling-v2.conf)
bindd = SUPER SHIFT, code:16, Move window to workspace 7, movetoworkspacesilent, 7
unbind = SUPER SHIFT, code:17  # was: Move window to workspace 8 (tiling-v2.conf)
bindd = SUPER SHIFT, code:17, Move window to workspace 8, movetoworkspacesilent, 8
unbind = SUPER SHIFT, code:18  # was: Move window to workspace 9 (tiling-v2.conf)
bindd = SUPER SHIFT, code:18, Move window to workspace 9, movetoworkspacesilent, 9
unbind = SUPER SHIFT, code:19  # was: Move window to workspace 10 (tiling-v2.conf)
bindd = SUPER SHIFT, code:19, Move window to workspace 10, movetoworkspacesilent, 10
